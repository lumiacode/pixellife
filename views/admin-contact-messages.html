<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>پیام‌های مشتریان | پیکسل‌لایف</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"/><link rel="stylesheet" href="/vendor/adminlte/css/adminlte.rtl.min.css"/><link rel="stylesheet" href="/css/admin-light.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>
body{font-family:Vazirmatn,Tahoma,sans-serif;color-scheme:light;background:#f8fafc!important;color:#1e293b!important}.app-wrapper,.app-main,.app-content,.app-content-header{background:#f8fafc!important;color:#1e293b!important}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:13.5px;font-weight:700;color:#334155;cursor:pointer}.tab .n{min-width:22px;height:22px;padding:0 6px;display:inline-grid;place-items:center;border-radius:11px;background:#eef2f7;font-size:12px}.tab.on{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.tab.on .n{background:#2563eb;color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.bar input{max-width:360px}
.msg-card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:16px 18px;margin-bottom:12px}.msg-card.new{border-right:4px solid #2563eb}
.msg-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}.msg-name{font-weight:800;font-size:15.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7;color:#334155}.chip.new{background:#dbeafe;color:#1d4ed8}.chip.read{background:#f1f5f9;color:#475569}.chip.replied{background:#dcfce7;color:#15803d}.chip.order{background:#fff7ed;color:#c2410c}
.msg-date{margin-inline-start:auto;font-size:12.5px;color:#64748b}
.contact-line{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:10px;font-size:14px}.contact-line a{display:inline-flex;align-items:center;gap:6px;color:#1d4ed8;font-weight:700;text-decoration:none;direction:ltr}.contact-line a:hover{text-decoration:underline}
.msg-subject{font-weight:700;margin-bottom:4px}.msg-body{white-space:pre-wrap;word-break:break-word;line-height:2;font-size:14px;color:#334155;background:#f8fafc;border:1px solid #eef2f7;border-radius:10px;padding:10px 14px}
.msg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.msg-actions .btn{min-height:38px}
.empty{text-align:center;color:#64748b;padding:40px 10px;background:#fff;border:1px dashed #cbd5e1;border-radius:12px}
.pager{display:flex;justify-content:center;gap:10px;margin-top:10px}
.toastbox{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2000}.toastbox.show{opacity:1}
</style>
<style id="admin-sidebar-critical">.app-sidebar:not(.admin-unified-sidebar){visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>
</head>
<body class="layout-fixed sidebar-expand-lg"><div class="app-wrapper"><nav class="app-header navbar bg-white border-bottom"><div class="container-fluid"><button class="btn btn-sm btn-outline-danger me-auto" id="logoutBtn"><i class="ti ti-logout"></i> خروج</button></div></nav><aside class="app-sidebar bg-white shadow-sm"><div class="sidebar-brand"><a href="/admin/products" class="brand-link">پیکسل<span>لایف</span></a></div><div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/admin/products" class="nav-link"><p>محصولات</p></a></li><li class="nav-item"><a href="/admin/orders" class="nav-link"><p>سفارش‌ها</p></a></li><li class="nav-item"><a href="/admin/support" class="nav-link active"><p>پشتیبانی در بله</p></a></li></ul></nav></div></aside>
<main class="app-main"><div class="app-content-header"><div class="container-fluid"><h3 class="mb-1">پیام‌های مشتریان</h3><p class="text-muted mb-0">پیام‌های فرم «تماس با ما» و درخواست‌های پشتیبانی از چت هوشمند. با نام و شمارهٔ تماس می‌توانید با مشتری در ارتباط باشید.</p></div></div>
<div class="app-content"><div class="container-fluid">
<div class="tabs" id="tabs" role="tablist"></div>
<div class="bar"><input id="search" class="form-control" type="search" placeholder="جست‌وجو: نام، شماره، موضوع، شمارهٔ سفارش یا متن پیام" autocomplete="off"></div>
<div id="list" aria-live="polite"></div>
<div class="pager" id="pager"></div>
</div></div></main><div class="toastbox" id="toast" role="status"></div></div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var STATUS={'':'همه',new:'جدید',read:'خوانده‌شده',replied:'پاسخ داده شد'};
var state={status:'',search:'',page:1};
var timer=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fa(n){return Number(n||0).toLocaleString('fa-IR')}
function when(v){try{return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch(e){return ''}}
function api(url,opt){opt=opt||{};opt.credentials='same-origin';if(opt.body&&typeof opt.body!=='string'){opt.body=JSON.stringify(opt.body);opt.headers={'Content-Type':'application/json'}}
return fetch(url,opt).then(function(r){return r.json().catch(function(){return{success:false,message:'پاسخ نامعتبر'}})})}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show')},2200)}
function telHref(p){return 'tel:'+String(p||'').replace(/[^0-9+]/g,'')}

function renderTabs(counts){
  var total=(counts.new||0)+(counts.read||0)+(counts.replied||0);
  var n={'':total,new:counts.new||0,read:counts.read||0,replied:counts.replied||0};
  $('tabs').innerHTML=Object.keys(STATUS).map(function(k){return '<button type="button" class="tab'+(state.status===k?' on':'')+'" data-s="'+k+'" role="tab" aria-selected="'+(state.status===k)+'">'+STATUS[k]+'<span class="n">'+fa(n[k])+'</span></button>'}).join('');
}
function card(m){
  var st=m.status||'new';
  var phone=m.phone?'<a href="'+esc(telHref(m.phone))+'"><i class="ti ti-phone"></i>'+esc(m.phone)+'</a>':'';
  var mail=m.email?'<a href="mailto:'+esc(m.email)+'"><i class="ti ti-mail"></i>'+esc(m.email)+'</a>':'';
  return '<article class="msg-card '+st+'" data-id="'+esc(m._id)+'">'+
    '<div class="msg-top"><span class="msg-name">'+esc(m.name)+'</span><span class="chip '+st+'">'+STATUS[st]+'</span>'+(m.orderNumber?'<span class="chip order">سفارش '+esc(m.orderNumber)+'</span>':'')+'<span class="msg-date">'+esc(when(m.createdAt))+'</span></div>'+
    '<div class="contact-line">'+phone+mail+'</div>'+
    '<div class="msg-subject">'+esc(m.subject)+'</div>'+
    '<div class="msg-body">'+esc(m.message)+'</div>'+
    '<div class="msg-actions">'+
      (st!=='read'?'<button type="button" class="btn btn-outline-secondary btn-sm" data-act="read">علامت‌گذاری: خوانده شد</button>':'')+
      (st!=='replied'?'<button type="button" class="btn btn-success btn-sm" data-act="replied">پاسخ دادم</button>':'')+
      (st!=='new'?'<button type="button" class="btn btn-outline-primary btn-sm" data-act="new">برگرداندن به جدید</button>':'')+
      '<button type="button" class="btn btn-outline-danger btn-sm me-auto" data-act="delete"><i class="ti ti-trash"></i> حذف</button>'+
    '</div></article>';
}
function load(){
  var q=new URLSearchParams({page:state.page,limit:20,status:state.status,search:state.search});
  api('/admin/api/contact-messages?'+q).then(function(j){
    if(!j.success){$('list').innerHTML='<div class="empty text-danger">'+esc(j.message||'دریافت پیام‌ها ناموفق بود')+'</div>';return}
    renderTabs(j.counts||{});
    $('list').innerHTML=j.messages.length?j.messages.map(card).join(''):'<div class="empty">پیامی پیدا نشد.</div>';
    var p=j.pagination||{page:1,totalPages:1};
    $('pager').innerHTML=p.totalPages>1?'<button class="btn btn-outline-secondary btn-sm" data-p="'+(p.page-1)+'" '+(p.page<=1?'disabled':'')+'>قبلی</button><span class="align-self-center small">صفحهٔ '+fa(p.page)+' از '+fa(p.totalPages)+'</span><button class="btn btn-outline-secondary btn-sm" data-p="'+(p.page+1)+'" '+(p.page>=p.totalPages?'disabled':'')+'>بعدی</button>':'';
  });
}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;state.status=b.dataset.s;state.page=1;load()});
$('pager').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(!b||b.disabled)return;state.page=Number(b.dataset.p);load();window.scrollTo({top:0,behavior:'smooth'})});
$('search').addEventListener('input',function(e){clearTimeout(timer);var v=e.target.value;timer=setTimeout(function(){state.search=v.trim();state.page=1;load()},300)});
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var id=b.closest('[data-id]').dataset.id,act=b.dataset.act;
  if(act==='delete'){
    if(!confirm('این پیام برای همیشه حذف شود؟'))return;
    api('/admin/api/contact-messages/'+encodeURIComponent(id),{method:'DELETE'}).then(function(j){if(!j.success){toast(j.message||'حذف نشد');return}toast('حذف شد');load()});
    return;
  }
  api('/admin/api/contact-messages/'+encodeURIComponent(id),{method:'PATCH',body:{status:act}}).then(function(j){if(!j.success){toast(j.message||'ذخیره نشد');return}toast('وضعیت به‌روز شد');load()});
});
$('logoutBtn').onclick=function(){fetch('/admin/logout',{method:'POST'}).finally(function(){location.href='/admin/login'})};
load();
})();
</script><script src="/js/admin-sidebar.js?v=19" defer></script></body></html>
