<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت مشتریان | پنل ادمین پیکسل‌لایف</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="/vendor/adminlte/css/adminlte.rtl.min.css" />
    <link rel="stylesheet" href="/css/admin-light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      body, .app-header, .app-sidebar { font-family: Vazirmatn, Tahoma, sans-serif; }
      body { color-scheme: light; background: #f8fafc !important; color: #1e293b !important; }
      .app-wrapper, .app-main, .app-content, .app-content-header { background: #f8fafc !important; color: #1e293b !important; }
      .card { background: #ffffff !important; color: #1e293b !important; border-color: #e2e8f0 !important; }
      .table { --bs-table-bg: #ffffff; --bs-table-color: #1e293b; --bs-table-border-color: #e2e8f0; --bs-table-striped-bg: #f8fafc; --bs-table-hover-bg: #eff6ff; --bs-table-hover-color: #1e293b; }
      .table > :not(caption) > * > * { background-color: var(--bs-table-bg) !important; color: var(--bs-table-color) !important; }
      .brand-link { font-weight: 800; } .brand-link span { color: #3b82f6; }
      .app-sidebar { background: #ffffff !important; border-left: 1px solid #e2e8f0; }
      .app-sidebar .nav-link, .app-sidebar .brand-link { color: #334155 !important; }
      .app-sidebar .nav-link:hover { background: #eff6ff; color: #2563eb !important; }
      .app-sidebar .nav-link.active { background: #dbeafe; color: #1d4ed8 !important; }
      .customer-name { font-weight: 700; color: #1e293b; } .customer-contact { font-size: 12px; color: #64748b; direction: ltr; text-align: right; }
      .status-badge { font-size: 11px; } #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1d4ed8; color:#fff; padding:12px 24px; border-radius:8px; z-index:9999; opacity:0; transition:.25s; } #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
  
  <style id="admin-sidebar-critical">
    .app-sidebar:not(.admin-unified-sidebar){visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  </style>
</head>
  <body class="layout-fixed sidebar-expand-lg">
    <div class="app-wrapper">
      <nav class="app-header navbar navbar-expand bg-white border-bottom"><div class="container-fluid"><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="ti ti-menu-2"></i></a></li></ul><ul class="navbar-nav ms-auto"><li class="nav-item"><button class="btn btn-sm btn-outline-danger" id="logoutBtn"><i class="ti ti-logout"></i> خروج</button></li></ul></div></nav>
      <aside class="app-sidebar bg-white shadow-sm"><div class="sidebar-brand"><a href="/admin/products" class="brand-link"><span class="brand-text">پیکسل<span>لایف</span></span></a></div><div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu"><li class="nav-item"><a href="/admin/products" class="nav-link"><i class="nav-icon ti ti-device-mobile"></i><p>محصولات</p></a></li><li class="nav-item"><a href="/admin/customers" class="nav-link active"><i class="nav-icon ti ti-users"></i><p>مشتریان</p></a></li><li class="nav-item"><a href="/admin/orders" class="nav-link"><i class="nav-icon ti ti-package"></i><p>سفارش‌ها</p></a></li><li class="nav-item"><a href="/admin/reviews" class="nav-link"><i class="nav-icon ti ti-message-star"></i><p>مدیریت نظرات</p></a></li><li class="nav-item"><a href="/admin/ai-products" class="nav-link"><i class="nav-icon ti ti-sparkles"></i><p>دستیار هوشمند محصولات</p></a></li><li class="nav-item"><a href="/admin/analytics" class="nav-link"><i class="nav-icon ti ti-chart-bar"></i><p>آمار بازدید</p></a></li><li class="nav-item"><a href="/" class="nav-link" target="_blank"><i class="nav-icon ti ti-external-link"></i><p>مشاهده‌ی سایت</p></a></li></ul></nav></div></aside>
      <main class="app-main"><div class="app-content-header"><div class="container-fluid"><div class="row align-items-center"><div class="col-sm-6"><h3 class="mb-0">مدیریت مشتریان</h3><p class="text-muted mb-0 small mt-1">فهرست حساب‌های ثبت‌نام‌شده در پیکسل‌لایف</p></div><div class="col-sm-6"><form class="d-flex gap-2 mt-3 mt-sm-0" id="searchForm"><input id="searchInput" class="form-control" placeholder="نام، موبایل یا ایمیل مشتری" autocomplete="off" /><button class="btn btn-primary text-nowrap" type="submit"><i class="ti ti-search"></i> جست‌وجو</button></form></div></div></div></div><div class="app-content"><div class="container-fluid"><div class="card"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><span class="text-muted small" id="summary">در حال بارگذاری...</span></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>مشتری</th><th>موبایل</th><th>ایمیل</th><th>تأیید</th><th>وضعیت حساب</th><th>آخرین ورود</th><th>عضویت</th><th>عملیات</th></tr></thead><tbody id="customersBody"><tr><td colspan="8" class="text-center text-muted py-4">در حال بارگذاری...</td></tr></tbody></table></div><div class="d-flex justify-content-center mt-3 gap-2" id="pagination"></div></div></div></div></div></main>
    </div><div id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/vendor/adminlte/js/adminlte.min.js"></script>
    <script>
      let currentPage = 1; const limit = 20;
      const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const asDate = value => value ? new Intl.DateTimeFormat('fa-IR', { dateStyle:'medium', timeStyle:'short' }).format(new Date(value)) : '—';
      const asBirthDate = value => value ? new Intl.DateTimeFormat('fa-IR', { dateStyle:'medium' }).format(new Date(value)) : '—';
      function toast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2800); }
      function customerName(user) { const name = [user.firstName, user.lastName].filter(Boolean).join(' ').trim(); return name || 'بدون نام'; }
      document.querySelector('.table thead tr').insertAdjacentHTML('afterbegin', '<th>کد ملی</th><th>تاریخ تولد</th>');
      async function loadCustomers(page = currentPage) {
        currentPage = page; const body = document.getElementById('customersBody'); body.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">در حال بارگذاری...</td></tr>';
        try { const params = new URLSearchParams({ page, limit }); const search = document.getElementById('searchInput').value.trim(); if (search) params.set('search', search); const response = await fetch('/admin/api/users?' + params); const json = await response.json(); if (!json.success) throw new Error(json.message || 'دریافت مشتریان ناموفق بود'); renderCustomers(json.users, json.pagination); } catch (error) { body.innerHTML = `<tr><td colspan="10" class="text-center text-danger py-4">${escapeHtml(error.message)}</td></tr>`; document.getElementById('summary').textContent = 'خطا در دریافت فهرست'; }
      }
      function renderCustomers(users, pagination) { const body = document.getElementById('customersBody'); document.getElementById('summary').textContent = `${Number(pagination.total).toLocaleString('fa-IR')} مشتری ثبت‌نام‌شده`; if (!users.length) { body.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">مشتری‌ای یافت نشد.</td></tr>'; } else { body.innerHTML = users.map(user => `<tr><td><div class="customer-name">${escapeHtml(customerName(user))}</div></td><td class="customer-contact">${escapeHtml(user.mobile || '—')}</td><td class="customer-contact">${escapeHtml(user.email || '—')}</td><td><span class="badge status-badge ${user.isVerified ? 'text-bg-success' : 'text-bg-secondary'}">${user.isVerified ? 'تأییدشده' : 'تأییدنشده'}</span></td><td><span class="badge status-badge ${user.isActive ? 'text-bg-success' : 'text-bg-danger'}">${user.isActive ? 'فعال' : 'غیرفعال'}</span></td><td class="small text-muted">${asDate(user.lastLogin)}</td><td class="small text-muted">${asDate(user.createdAt)}</td><td><button class="btn btn-sm ${user.isActive ? 'btn-outline-danger' : 'btn-outline-success'}" data-user-id="${user._id}" data-user-active="${user.isActive}">${user.isActive ? 'غیرفعال‌سازی' : 'فعال‌سازی'}</button></td></tr>`).join(''); } renderPagination(pagination); }
      function renderCustomers(users, pagination) {
        const body = document.getElementById('customersBody');
        document.getElementById('summary').textContent = `${Number(pagination.total).toLocaleString('fa-IR')} مشتری ثبت‌نام‌شده`;
        if (!users.length) { body.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">مشتری‌ای یافت نشد.</td></tr>'; renderPagination(pagination); return; }
        body.innerHTML = users.map(user => `<tr><td class="customer-contact">${escapeHtml(user.nationalCode || '—')}</td><td class="small text-muted">${asBirthDate(user.birthDate)}</td><td><div class="customer-name">${escapeHtml(customerName(user))}</div></td><td class="customer-contact">${escapeHtml(user.mobile || '—')}</td><td class="customer-contact">${escapeHtml(user.email || '—')}</td><td><span class="badge status-badge ${user.isVerified ? 'text-bg-success' : 'text-bg-secondary'}">${user.isVerified ? 'تأییدشده' : 'تأییدنشده'}</span></td><td><span class="badge status-badge ${user.isActive ? 'text-bg-success' : 'text-bg-danger'}">${user.isActive ? 'فعال' : 'غیرفعال'}</span></td><td class="small text-muted">${asDate(user.lastLogin)}</td><td class="small text-muted">${asDate(user.createdAt)}</td><td><button class="btn btn-sm ${user.isActive ? 'btn-outline-danger' : 'btn-outline-success'}" data-user-id="${user._id}" data-user-active="${user.isActive}">${user.isActive ? 'غیرفعال‌سازی' : 'فعال‌سازی'}</button></td></tr>`).join('');
        renderPagination(pagination);
      }
      function renderPagination(p) { const el = document.getElementById('pagination'); el.innerHTML = ''; if (p.totalPages <= 1) return; const previous = document.createElement('button'); previous.className = 'btn btn-sm btn-outline-secondary'; previous.textContent = 'بعدی'; previous.disabled = p.page >= p.totalPages; previous.onclick = () => loadCustomers(p.page + 1); const label = document.createElement('span'); label.className = 'align-self-center small text-muted px-2'; label.textContent = `صفحه ${p.page.toLocaleString('fa-IR')} از ${p.totalPages.toLocaleString('fa-IR')}`; const next = document.createElement('button'); next.className = 'btn btn-sm btn-outline-secondary'; next.textContent = 'قبلی'; next.disabled = p.page <= 1; next.onclick = () => loadCustomers(p.page - 1); el.append(previous, label, next); }
      document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); loadCustomers(1); });
      document.getElementById('customersBody').addEventListener('click', async event => { const button = event.target.closest('[data-user-id]'); if (!button) return; const active = button.dataset.userActive === 'true'; if (!confirm(active ? 'حساب این مشتری غیرفعال شود؟' : 'حساب این مشتری فعال شود؟')) return; button.disabled = true; try { const response = await fetch(`/admin/api/users/${button.dataset.userId}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({isActive: !active}) }); const json = await response.json(); if (!json.success) throw new Error(json.message || 'تغییر وضعیت ناموفق بود'); toast(!active ? 'حساب مشتری فعال شد' : 'حساب مشتری غیرفعال شد'); loadCustomers(); } catch (error) { toast(error.message); button.disabled = false; } });
      document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/admin/logout', {method:'POST'}); location.href = '/admin/login'; }); loadCustomers();
    </script>
  <script src="/js/admin-sidebar.js?v=13" defer></script>
  <script src="/js/history-safe-anchors.js?v=1"></script></body>
</html>
