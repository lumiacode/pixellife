<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>کدهای تخفیف | پیکسل‌لایف</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"/><link rel="stylesheet" href="/vendor/adminlte/css/adminlte.rtl.min.css"/><link rel="stylesheet" href="/css/admin-light.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/><style>
body{font-family:Vazirmatn,Tahoma,sans-serif;color-scheme:light;background:#f8fafc!important;color:#1e293b!important}.app-wrapper,.app-main,.app-content,.app-content-header{background:#f8fafc!important;color:#1e293b!important}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}.small-muted{color:#64748b;font-size:.8rem}.code-chip{font-family:monospace;font-weight:800;letter-spacing:.5px;background:#f1f5f9;border-radius:8px;padding:3px 8px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(15,23,42,.3)}dialog::backdrop{background:rgba(15,23,42,.45)}dialog form{padding:20px}
.err{color:#dc2626;font-size:.85rem;min-height:1.2em}.table td{vertical-align:middle}
</style>
<style id="admin-sidebar-critical">
    .app-sidebar:not(.admin-unified-sidebar){visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg"><div class="app-wrapper"><nav class="app-header navbar bg-white border-bottom"><div class="container-fluid"><button class="btn btn-sm btn-outline-danger me-auto" id="logoutBtn"><i class="ti ti-logout"></i> خروج</button></div></nav><aside class="app-sidebar bg-white shadow-sm"><div class="sidebar-brand"><a href="/admin/products" class="brand-link">پیکسل<span>لایف</span></a></div><div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/admin/products" class="nav-link"><i class="nav-icon ti ti-device-mobile"></i><p>محصولات</p></a></li><li class="nav-item"><a href="/admin/customers" class="nav-link"><i class="nav-icon ti ti-users"></i><p>مشتریان</p></a></li><li class="nav-item"><a href="/admin/discounts" class="nav-link active"><i class="nav-icon ti ti-ticket"></i><p>کدهای تخفیف</p></a></li><li class="nav-item"><a href="/admin/orders" class="nav-link"><i class="nav-icon ti ti-package"></i><p>سفارش‌ها</p></a></li><li class="nav-item"><a href="/admin/reviews" class="nav-link"><i class="nav-icon ti ti-message-star"></i><p>مدیریت نظرات</p></a></li><li class="nav-item"><a href="/admin/ai-products" class="nav-link"><i class="nav-icon ti ti-sparkles"></i><p>دستیار هوشمند محصولات</p></a></li><li class="nav-item"><a href="/admin/analytics" class="nav-link"><i class="nav-icon ti ti-chart-bar"></i><p>آمار بازدید</p></a></li><li class="nav-item"><a href="/" class="nav-link" target="_blank"><i class="nav-icon ti ti-external-link"></i><p>مشاهده‌ی سایت</p></a></li></ul></nav></div></aside><main class="app-main"><div class="app-content-header"><div class="container-fluid"><h3 class="mb-1">کدهای تخفیف</h3><p class="text-muted mb-0">ساخت و مدیریت کدهای تخفیفی که مشتری در مرحلهٔ پرداخت وارد می‌کند.</p></div></div><div class="app-content"><div class="container-fluid"><div class="panel">
<div class="d-flex flex-wrap gap-2 mb-3 align-items-center"><input id="search" class="form-control" style="max-width:240px" placeholder="جستجوی کد..." autocomplete="off"><select id="filter" class="form-select" style="max-width:180px"><option value="">همه</option><option value="active">فعال</option><option value="inactive">غیرفعال</option><option value="expired">منقضی</option></select><span id="summary" class="small-muted"></span><button id="newBtn" class="btn btn-primary ms-auto" type="button"><i class="ti ti-plus"></i> کد جدید</button></div>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>کد</th><th>مقدار</th><th>حداقل خرید</th><th>مصرف</th><th>انقضا</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="body"><tr><td colspan="7" class="text-center py-4 text-muted">در حال دریافت...</td></tr></tbody></table></div>
<div id="pager" class="d-flex gap-2 justify-content-center"></div></div></div></div></main>
<dialog id="dlg"><form id="form" method="dialog" novalidate><h5 id="dlgTitle" class="mb-3">کد جدید</h5><div class="row g-3">
<div class="col-6"><label class="form-label" for="f-code">کد</label><input id="f-code" class="form-control" dir="ltr" maxlength="32" placeholder="SUMMER20"></div>
<div class="col-6"><label class="form-label" for="f-title">عنوان (اختیاری)</label><input id="f-title" class="form-control" maxlength="80"></div>
<div class="col-6"><label class="form-label" for="f-type">نوع</label><select id="f-type" class="form-select"><option value="percent">درصدی</option><option value="fixed">مبلغ ثابت</option></select></div>
<div class="col-6"><label class="form-label" for="f-value" id="valueLabel">درصد تخفیف</label><input id="f-value" class="form-control" inputmode="numeric" dir="ltr"></div>
<div class="col-6" id="maxWrap"><label class="form-label" for="f-max">سقف تخفیف (تومان، ۰ = بدون سقف)</label><input id="f-max" class="form-control" inputmode="numeric" dir="ltr" value="0"></div>
<div class="col-6"><label class="form-label" for="f-min">حداقل مبلغ سفارش (تومان)</label><input id="f-min" class="form-control" inputmode="numeric" dir="ltr" value="0"></div>
<div class="col-6"><label class="form-label" for="f-limit">سقف دفعات استفاده (۰ = نامحدود)</label><input id="f-limit" class="form-control" inputmode="numeric" dir="ltr" value="0"></div>
<div class="col-6"><label class="form-label" for="f-exp">انقضا (شمسی، مثل 1405/03/31 یا 1405/03/31 18:00)</label><input id="f-exp" class="form-control" dir="ltr" placeholder="بدون انقضا"></div>
<div class="col-12 form-check ms-3"><input id="f-active" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="f-active">فعال</label></div></div>
<div id="formErr" class="err mt-2" role="alert"></div><div class="d-flex gap-2 justify-content-end mt-2"><button type="button" id="cancelBtn" class="btn btn-outline-secondary">انصراف</button><button type="submit" id="saveBtn" class="btn btn-primary">ذخیره</button></div></form></dialog>
<script>
(function(){
var page=1,limit=20,editing=null,$=function(id){return document.getElementById(id)};
var e=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=function(n){return Number(n||0).toLocaleString('fa-IR')};
var STATE={active:['فعال','text-bg-success'],inactive:['غیرفعال','text-bg-secondary'],expired:['منقضی','text-bg-danger'],exhausted:['تمام‌شده','text-bg-warning']};
function jalali(v,withTime){var p={};new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v)).forEach(function(x){p[x.type]=x.value});
return p.year+'/'+p.month+'/'+p.day+(withTime?' '+p.hour+':'+p.minute:'')}
function api(url,opt){opt=opt||{};if(opt.body&&typeof opt.body!=='string'){opt.body=JSON.stringify(opt.body);opt.headers={'Content-Type':'application/json'}}
return fetch(url,opt).then(function(r){return r.json().catch(function(){return{success:false,message:'پاسخ نامعتبر'}})})}
function load(p){page=p||page;var q=new URLSearchParams({page:page,limit:limit,search:$('search').value.trim(),status:$('filter').value});
api('/admin/api/discounts?'+q).then(function(j){var b=$('body');
if(!j.success){b.innerHTML='<tr><td colspan="7" class="text-danger text-center py-4">'+e(j.message||'خطا در دریافت کدها')+'</td></tr>';return}
$('summary').textContent=nf(j.pagination.total)+' کد';
b.innerHTML=j.discounts.length?j.discounts.map(function(d){var s=STATE[d.state]||STATE.inactive;
return '<tr><td><span class="code-chip">'+e(d.code)+'</span><div class="small-muted">'+e(d.title)+'</div></td><td>'+
(d.type==='percent'?nf(d.value)+'٪'+(d.maxDiscount?'<div class="small-muted">تا '+nf(d.maxDiscount)+' تومان</div>':''):nf(d.value)+' تومان')+'</td><td>'+(d.minOrderAmount?nf(d.minOrderAmount)+' تومان':'—')+
'</td><td>'+nf(d.usedCount)+' / '+(d.usageLimit?nf(d.usageLimit):'∞')+'</td><td>'+(d.expiresAt?e(jalali(d.expiresAt,true)):'—')+'</td><td><span class="badge '+s[1]+'">'+s[0]+'</span></td><td class="text-nowrap">'+
'<button class="btn btn-sm btn-outline-primary" data-act="edit" data-id="'+e(d._id)+'">ویرایش</button> <button class="btn btn-sm btn-outline-secondary" data-act="toggle" data-id="'+e(d._id)+'" data-on="'+(d.isActive?'1':'0')+'">'+(d.isActive?'غیرفعال':'فعال')+'</button> <button class="btn btn-sm btn-outline-danger" data-act="del" data-id="'+e(d._id)+'">حذف</button></td></tr>'}).join(''):'<tr><td colspan="7" class="text-center py-4 text-muted">کدی پیدا نشد</td></tr>';
items=j.discounts;var t=j.pagination.totalPages;$('pager').innerHTML=t>1?'<button class="btn btn-sm btn-outline-secondary" data-pg="'+(page-1)+'" '+(page<=1?'disabled':'')+'>قبلی</button><span class="align-self-center small-muted">'+nf(page)+' از '+nf(t)+'</span><button class="btn btn-sm btn-outline-secondary" data-pg="'+(page+1)+'" '+(page>=t?'disabled':'')+'>بعدی</button>':''})}
var items=[];
function syncType(){var pc=$('f-type').value==='percent';$('maxWrap').style.display=pc?'':'none';$('valueLabel').textContent=pc?'درصد تخفیف':'مبلغ تخفیف (تومان)'}
function openForm(d){editing=d||null;$('dlgTitle').textContent=d?'ویرایش کد تخفیف':'کد جدید';$('formErr').textContent='';
$('f-code').value=d?d.code:'';$('f-code').readOnly=!!(d&&d.usedCount>0);$('f-title').value=d?d.title||'':'';$('f-type').value=d?d.type:'percent';$('f-value').value=d?d.value:'';
$('f-max').value=d?d.maxDiscount||0:0;$('f-min').value=d?d.minOrderAmount||0:0;$('f-limit').value=d?d.usageLimit||0:0;$('f-exp').value=d&&d.expiresAt?jalali(d.expiresAt,true):'';$('f-active').checked=d?!!d.isActive:true;syncType();$('dlg').showModal()}
$('newBtn').onclick=function(){openForm(null)};$('cancelBtn').onclick=function(){$('dlg').close()};$('f-type').onchange=syncType;
$('form').addEventListener('submit',function(ev){ev.preventDefault();$('formErr').textContent='';var body={code:$('f-code').value.trim(),title:$('f-title').value.trim(),type:$('f-type').value,value:$('f-value').value,maxDiscount:$('f-max').value,minOrderAmount:$('f-min').value,usageLimit:$('f-limit').value,expiresAt:$('f-exp').value.trim(),isActive:$('f-active').checked};
$('saveBtn').disabled=true;api(editing?'/admin/api/discounts/'+encodeURIComponent(editing._id):'/admin/api/discounts',{method:editing?'PUT':'POST',body:body}).then(function(j){$('saveBtn').disabled=false;
if(!j.success){$('formErr').textContent=j.message||'ذخیره نشد';return}$('dlg').close();load()})});
$('body').addEventListener('click',function(ev){var t=ev.target.closest('button[data-act]');if(!t)return;var id=t.dataset.id;
if(t.dataset.act==='edit'){openForm(items.find(function(x){return x._id===id}))}
else if(t.dataset.act==='toggle'){api('/admin/api/discounts/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:{isActive:t.dataset.on!=='1'}}).then(function(j){if(!j.success)alert(j.message);load()})}
else if(t.dataset.act==='del'){if(!confirm('این کد تخفیف حذف شود؟'))return;api('/admin/api/discounts/'+encodeURIComponent(id),{method:'DELETE'}).then(function(j){if(!j.success)alert(j.message);load()})}});
$('pager').addEventListener('click',function(ev){var t=ev.target.closest('button[data-pg]');if(t)load(Number(t.dataset.pg))});
var timer;$('search').addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){load(1)},300)});$('filter').onchange=function(){load(1)};
$('logoutBtn').onclick=function(){fetch('/admin/logout',{method:'POST'}).finally(function(){location.href='/admin/login'})};
load(1);
})();
</script><script src="/js/admin-sidebar.js?v=11" defer></script></body></html>
