<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مدیریت نظرات | PixelLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet">
  <style>
    body{background:#f5f7fb;font-family:Tahoma,sans-serif;color:#1e293b}.shell{max-width:1200px;margin:32px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.review{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0f172a08}.review-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.stars{color:#f59e0b;letter-spacing:2px}.meta{font-size:13px;color:#64748b;line-height:2}.comment{white-space:pre-wrap;line-height:2;margin:16px 0}.tag{display:inline-block;background:#f1f5f9;border-radius:7px;padding:4px 8px;margin:2px;font-size:12px}.userbox{background:#f8fafc;border-radius:10px;padding:12px;margin-top:12px}.empty{background:#fff;border-radius:14px;padding:50px;text-align:center;color:#64748b}.status{border-radius:20px;padding:5px 10px;font-size:12px}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}@media(max-width:600px){.top,.review-head{align-items:stretch;flex-direction:column}.shell{margin-top:18px}.review{padding:15px}}
  </style>
<link rel="stylesheet" href="/css/admin-light.css">
  <style id="admin-sidebar-critical">
    .app-sidebar:not(.admin-unified-sidebar){visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div><h1 class="h3 mb-1">مدیریت نظرات کاربران</h1><p class="text-secondary mb-0">هر نظر قبل از نمایش عمومی باید تأیید شود.</p></div>
      <a class="btn btn-outline-primary" href="/admin/products"><i class="ti ti-arrow-right"></i> محصولات</a>
    </div>
    <div class="tabs mb-3">
      <button class="btn btn-warning active" data-status="pending">در انتظار تأیید</button>
      <button class="btn btn-outline-success" data-status="approved">تأییدشده</button>
      <button class="btn btn-outline-danger" data-status="rejected">ردشده</button>
    </div>
    <div id="reviews"><div class="empty">در حال بارگذاری...</div></div>
  </main>
<script>
let status="pending";
const el=document.getElementById("reviews");
const fa=n=>Number(n||0).toLocaleString("fa-IR");
const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function userInfo(u){if(!u)return "اطلاعات کاربر در دسترس نیست";return `نام: ${escape([u.firstName,u.lastName].filter(Boolean).join(" ")||"ثبت نشده")}<br>موبایل: ${escape(u.mobile||"ثبت نشده")}<br>ایمیل: ${escape(u.email||"ثبت نشده")}<br>کد ملی: ${escape(u.nationalCode||"ثبت نشده")}<br>تاریخ تولد: ${u.birthDate?new Date(u.birthDate).toLocaleDateString("fa-IR"):"ثبت نشده"}<br>تأیید موبایل: ${u.isVerified?"بله":"خیر"}<br>وضعیت حساب: ${u.isActive===false?"غیرفعال":"فعال"}`;}
function card(r){const p=r.product;const d=new Date(r.date).toLocaleString("fa-IR");const pros=(r.pros||[]).map(x=>`<span class="tag text-success">+ ${escape(x)}</span>`).join("");const cons=(r.cons||[]).map(x=>`<span class="tag text-danger">− ${escape(x)}</span>`).join("");const actions=status==="pending"?`<button class="btn btn-success btn-sm" onclick="setStatus('${r._id}','approved')">تأیید و انتشار</button> <button class="btn btn-outline-danger btn-sm" onclick="setStatus('${r._id}','rejected')">رد نظر</button>`:status==="approved"?`<button class="btn btn-outline-danger btn-sm" onclick="setStatus('${r._id}','rejected')">حذف از نمایش عمومی</button>`:`<button class="btn btn-outline-warning btn-sm" onclick="setStatus('${r._id}','pending')">بازگرداندن به بررسی</button>`;return `<article class="review"><div class="review-head"><div><strong>${escape(r.userName)}</strong><div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div><div class="meta">${d} · مفید بود: ${fa(r.helpful)}</div></div><div><span class="status ${escape(r.status)}">${r.status==="pending"?"در انتظار":r.status==="approved"?"منتشرشده":"ردشده"}</span></div></div><div class="comment">${escape(r.comment)}</div><div>${pros}${cons}</div><div class="userbox"><strong>مشخصات کاربر</strong><div class="meta">${userInfo(r.userId)}</div></div><div class="userbox"><strong>محصول</strong><div class="meta">${p?`${escape(p.name)} · ${escape(p.brand||"")} · ${escape(p.category||"")}`:"محصول پیدا نشد"}<br>شناسه محصول: ${escape(r.productId)}</div></div><div class="mt-3">${actions}</div></article>`;}
async function load(){el.innerHTML='<div class="empty">در حال بارگذاری...</div>';try{const res=await fetch("/admin/api/reviews?status="+status,{cache:"no-store"});const json=await res.json();if(!json.success)throw new Error(json.message);el.innerHTML=json.reviews.length?json.reviews.map(card).join(""):'<div class="empty">در این بخش نظری وجود ندارد.</div>'}catch(e){el.innerHTML='<div class="empty text-danger">'+escape(e.message||"خطا در دریافت نظرات")+'</div>'}}
async function setStatus(id,next){try{const res=await fetch("/admin/api/reviews/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:next})});const json=await res.json();if(!json.success)throw new Error(json.message);load()}catch(e){alert(e.message||"انجام عملیات ناموفق بود")}}
document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{status=b.dataset.status;document.querySelectorAll("[data-status]").forEach(x=>x.className="btn btn-outline-secondary");b.className=status==="pending"?"btn btn-warning active":status==="approved"?"btn btn-success active":"btn btn-danger active";load()});load();
</script>
<script src="/js/admin-sidebar.js?v=14" defer></script></body></html>
