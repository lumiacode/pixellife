<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شگفت‌انگیزها | PixelLife</title>
    <meta name="description" content="محصولات شگفت‌انگیز فعال پیکسل‌لایف با زمان باقی‌مانده پیشنهاد." />
    <link rel="stylesheet" href="/css/local-fonts.css?v=1" />
    <link rel="stylesheet" href="/css/tabler-icons.min.css?v=perf-1" />
    <link rel="stylesheet" href="/css/shared-category-nav.css?v=2" />
    <style>
      :root{--blue:#3b82f6;--blue-dark:#2563eb;--blue-light:#eff6ff;--bg:#f8fafc;--white:#fff;--border:#e2e8f0;--text-1:#0f172a;--text-2:#334155;--text-3:#64748b;--red:#dc2626;--green:#16803a;--shadow:0 5px 20px rgba(15,23,42,.06)}
      *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text-1);font-family:Vazirmatn,Tahoma,sans-serif}.header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:900}.header-inner{max-width:1200px;height:68px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:22px}.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-1);font-size:22px;font-weight:800}.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}.logo span{color:var(--blue)}.search{flex:1;max-width:540px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--bg);display:flex;align-items:center;padding:0 14px;gap:8px;color:var(--text-3)}.search input{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--text-1)}.header-actions{margin-right:auto;display:flex;align-items:center;gap:10px}.amazing-auth-btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text-2);font:600 13px Vazirmatn,Tahoma,sans-serif;text-decoration:none;white-space:nowrap}.amazing-auth-btn:hover{color:var(--blue);border-color:var(--blue)}.header-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;display:grid!important;place-items:center;text-decoration:none;color:#1e293b!important;background:#fff;flex:0 0 44px;font-size:22px}.header-btn i{display:block!important;font-size:22px;line-height:1}.navbar{background:#fff;border-bottom:1px solid var(--border);position:relative;z-index:800}.navbar-inner{max-width:1200px;margin:auto;padding:0 24px;height:48px;display:flex;align-items:center;gap:22px}.nav-link,.nav-cats{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--text-2);font:600 13px Vazirmatn,Tahoma,sans-serif;text-decoration:none;white-space:nowrap;height:48px}.nav-link:hover,.nav-link.active,.nav-cats:hover{color:var(--blue)}.nav-cats-wrap{position:relative}.nav-cats i{font-size:17px}.cart-badge{position:absolute;top:-4px;left:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;pointer-events:none}.cart-wrap{position:relative}.page{max-width:1200px;margin:auto;padding:28px 24px 48px}.hero{background:linear-gradient(135deg,#2563eb,#3b82f6);border-radius:22px;padding:28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;box-shadow:0 12px 35px rgba(37,99,235,.16)}.hero-main{display:flex;align-items:center;gap:16px}.hero-icon{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:34px}.hero h1{font-size:27px;margin:0 0 5px}.hero p{margin:0;opacity:.9;font-size:14px}.hero-count{background:#fff;color:var(--blue-dark);padding:9px 14px;border-radius:999px;font-weight:800;white-space:nowrap}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}.section-head h2{font-size:20px;margin:0}.section-head span{font-size:13px;color:var(--text-3)}.amazing-products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:0;background:#fff}.card{position:relative;background:#fff;border:0;border-inline-end:1px solid #e5e7eb;border-block-end:1px solid #e5e7eb;border-radius:0;min-width:0;margin:0;padding:12px;display:flex;flex-direction:column;text-decoration:none;color:inherit;box-shadow:none;overflow:hidden}.ribbon{position:absolute;right:10px;top:10px;z-index:3;background:var(--red);color:#fff;padding:5px 10px;border-radius:9px;font-size:11px;font-weight:800;box-shadow:0 3px 9px rgba(220,38,38,.22)}.discount-badge{position:absolute;left:10px;top:10px;z-index:3;background:#dc2626;color:#fff;padding:4px 7px;border-radius:8px;font-size:11px;font-weight:800;direction:ltr}.media{height:235px;display:grid;place-items:center;padding:8px;margin-top:44px}.media img{width:100%;height:100%;object-fit:contain;display:block}.brand{font-size:12px;color:var(--text-3);margin-bottom:4px}.name{font-size:14px;font-weight:800;line-height:24px;min-height:48px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.timer{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 9px;border-radius:9px;background:#fff5f5;color:#b91c1c;font-size:12px;font-weight:700}.footer{margin-top:9px;padding-top:9px;border-top:0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.stock{font-size:12px;font-weight:700}.stock.in{color:var(--green)}.stock.out{color:#c2413a}.price-stack{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.price-old{color:#9ca3af;font-size:10px;font-weight:400;text-decoration:line-through;text-decoration-thickness:1px;white-space:nowrap}.price{font-size:14px;font-weight:700;white-space:nowrap}.state{grid-column:1/-1;background:#fff;border:1px solid var(--border);border-radius:16px;min-height:190px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--text-3)}.state i{font-size:34px;color:var(--blue);display:block;margin-bottom:8px}.back-home{display:inline-flex;align-items:center;gap:6px;margin-top:12px;color:var(--blue-dark);font-weight:700;text-decoration:none}.footer-site{border-top:1px solid var(--border);background:#fff;padding:24px;text-align:center;color:var(--text-3);font-size:13px}
      @media(max-width:768px){.header-inner{height:auto;min-height:64px;padding:10px 16px;flex-wrap:wrap}.amazing-auth-btn{width:42px;padding:0;justify-content:center}.amazing-auth-btn span{display:none}.search{order:3;max-width:none;flex-basis:100%}.page{padding:18px 14px 36px}.hero{padding:20px 16px;border-radius:17px;align-items:flex-start}.hero h1{font-size:22px}.hero-icon{width:50px;height:50px;font-size:27px}.amazing-products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.card{padding:9px;border-radius:0}.media{height:180px;padding:4px;margin-top:32px}.brand{font-size:11px}.name{font-size:12px;line-height:20px;min-height:40px}.footer{align-items:flex-start;flex-direction:column}.price,.stock,.timer{font-size:11px}.hero-count{display:none}}
    </style>
  <link rel="stylesheet" href="/css/site-edge-layout.css?v=1" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo"><span class="logo-mark"><i class="ti ti-bolt"></i></span><span>Pixel<span>Life</span></span></a>
        <label class="search"><i class="ti ti-search"></i><input id="amazingSearch" type="search" placeholder="جستجو در محصولات شگفت‌انگیز" /></label>
        <div class="header-actions"><div class="cart-wrap"><a href="/cart" class="header-btn" aria-label="سبد خرید"><i class="ti ti-shopping-cart"></i></a><span class="cart-badge" id="cartCount">0</span></div><a href="/?openLogin=1" class="amazing-auth-btn"><i class="ti ti-login"></i><span>ورود | ثبت‌نام</span></a></div>
      </div>
    </header>
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="nav-cats-wrap">
          <button class="nav-cats" id="catsToggle" type="button"><i class="ti ti-menu-2"></i> همه دسته‌بندی‌ها <i class="ti ti-chevron-down"></i></button>
          <div class="megamenu-panel" id="megamenuPanel"><div class="megamenu-cats" id="megamenuCats"></div><div class="megamenu-content" id="megamenuContent"></div></div>
        </div>
        <a href="/" class="nav-link"><i class="ti ti-home"></i> خانه</a>
        <a href="/amazing" class="nav-link active"><i class="ti ti-bolt"></i> شگفت‌انگیز</a>
        <a href="/new" class="nav-link"><i class="ti ti-sparkles"></i> تازه‌ها</a>
        <a href="/bestsellers" class="nav-link"><i class="ti ti-trending-up"></i> پرفروش‌ترین</a>
        <a href="/brands" class="nav-link"><i class="ti ti-building-store"></i> برندها</a>
      </div>
    </nav>
    <div class="megamenu-backdrop" id="megamenuBackdrop"></div>
    <main class="page">
      <section class="hero">
        <div class="hero-main"><div class="hero-icon"><i class="ti ti-bolt"></i></div><div><h1>محصولات شگفت‌انگیز</h1></div></div>
        <div class="hero-count" id="heroCount">در حال دریافت...</div>
      </section>
      <div class="section-head"><h2>شگفت‌انگیزهای فعال</h2><span id="resultText"></span></div>
      <section class="amazing-products-grid" id="amazingGrid" aria-live="polite"><div class="state"><div><i class="ti ti-loader-2"></i>در حال بارگذاری محصولات شگفت‌انگیز...</div></div></section>
    </main>

    <footer class="footer-site">PixelLife — فروشگاه محصولات دیجیتال</footer>
    <link rel="stylesheet" href="/css/mobile-bottom-nav.css?v=10" />
    <script src="/js/shared-category-nav.js?v=4" defer></script>
    <script src="/js/mobile-bottom-nav.js?v=12" defer></script>
    <script>
      (() => {
        const updateCartCount=()=>{try{const cart=JSON.parse(localStorage.getItem("digishop_cart")||"[]");const n=cart.reduce((s,i)=>s+Math.max(1,Number(i.quantity??i.qty??1)),0);const el=document.getElementById("cartCount");if(el){el.textContent=n>99?"99+":n;el.style.display=n?"flex":"none";}}catch(_){}};
        updateCartCount(); window.addEventListener("storage",updateCartCount); window.addEventListener("cartUpdated",updateCartCount);
      })();
    </script>
    <script>
      (() => {
        const grid = document.getElementById('amazingGrid');
        const search = document.getElementById('amazingSearch');
        const heroCount = document.getElementById('heroCount');
        const resultText = document.getElementById('resultText');
        let products = [];

        const escapeHtml = (value) => {
          const div = document.createElement('div');
          div.textContent = value == null ? '' : String(value);
          return div.innerHTML;
        };
        const imageFor = (product) => product.mainImage || (Array.isArray(product.images) ? product.images[0] : '') || '/images/product-placeholder.svg';
        const isActive = (product) => product.amazingOffer === true && (!product.amazingOfferEndsAt || new Date(product.amazingOfferEndsAt).getTime() > Date.now());
        const remaining = (value) => {
          if (!value) return 'تا زمان غیرفعال‌سازی توسط فروشگاه';
          const diff = new Date(value).getTime() - Date.now();
          if (diff <= 0) return 'پایان یافته';
          const days = Math.floor(diff / 86400000);
          const hours = Math.floor((diff % 86400000) / 3600000);
          const mins = Math.floor((diff % 3600000) / 60000);
          const secs = Math.floor((diff % 60000) / 1000);
          return days > 0 ? `${days.toLocaleString('fa-IR')} روز و ${hours.toLocaleString('fa-IR')} ساعت باقی‌مانده` : `${hours}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} باقی‌مانده`;
        };
        const render = () => {
          const q = String(search.value || '').trim().toLowerCase();
          const list = products.filter(isActive).filter((p) => !q || [p.name,p.brand,p.category].some((v) => String(v || '').toLowerCase().includes(q)));
          heroCount.textContent = `${products.filter(isActive).length.toLocaleString('fa-IR')} پیشنهاد فعال`;
          resultText.textContent = q ? `${list.length.toLocaleString('fa-IR')} نتیجه` : '';
          if (!list.length) {
            grid.innerHTML = `<div class="state"><div><i class="ti ti-bolt-off"></i>${q ? 'محصولی با این عبارت پیدا نشد.' : 'در حال حاضر محصول شگفت‌انگیز فعالی وجود ندارد.'}<br><a class="back-home" href="/"><i class="ti ti-arrow-right"></i> بازگشت به صفحه اصلی</a></div></div>`;
            return;
          }
          grid.innerHTML = list.map((p) => {
            const discount = Math.max(0, Number(p.discountPercent || p.discount || 0));
            const out = p.availability === 'out' || Number(p.stock) <= 0;
            const originalPrice = Math.max(0, Number(p.price) || 0);
            const finalPrice = discount > 0 ? Math.round(originalPrice * (100 - Math.min(99, discount)) / 100) : originalPrice;
            const price = out ? '' : `<span class="price-stack">${discount > 0 ? `<span class="price-old">${originalPrice.toLocaleString('fa-IR')}</span>` : ''}<span class="price">${finalPrice.toLocaleString('fa-IR')} تومان</span></span>`;
            const discountBadge = discount > 0 ? `<span class="discount-badge">${discount}%</span>` : '';
            return `<a class="card" href="/product?id=${encodeURIComponent(p.slug || p._id || '')}"><span class="ribbon">شگفت‌انگیز</span>${discountBadge}<div class="media"><img src="${escapeHtml(imageFor(p))}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='/images/product-placeholder.svg'"></div><div class="brand">${escapeHtml(p.brand || '')}</div><div class="name">${escapeHtml(p.name || '')}</div><div class="timer"><i class="ti ti-clock"></i><span data-end="${escapeHtml(p.amazingOfferEndsAt || '')}">${escapeHtml(remaining(p.amazingOfferEndsAt))}</span></div><div class="footer"><span class="stock ${out ? 'out' : 'in'}"><i class="ti ${out ? 'ti-circle-x' : 'ti-circle-check'}"></i> ${out ? 'ناموجود' : 'موجود'}</span>${price}</div></a>`;
          }).join('');
        };
        fetch('/api/products?amazing=true&limit=100', { cache: 'no-store' })
          .then((r) => { if (!r.ok) throw new Error('request failed'); return r.json(); })
          .then((data) => { products = Array.isArray(data.products) ? data.products : []; render(); })
          .catch(() => { grid.innerHTML = '<div class="state"><div><i class="ti ti-alert-circle"></i>خطا در دریافت محصولات. دوباره صفحه را باز کنید.</div></div>'; heroCount.textContent = 'خطا در دریافت'; });
        search.addEventListener('input', render);
        setInterval(() => {
          document.querySelectorAll('.timer span[data-end]').forEach((el) => {
            const text = remaining(el.dataset.end);
            if (text === 'پایان یافته') { render(); return; }
            el.textContent = text;
          });
        }, 1000);
      })();
    </script>
      <script src="/js/product-ratings.js?v=2" defer></script>
  </body>
</html>
