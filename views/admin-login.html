<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود ادمین | پیکسل‌لایف</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link rel="stylesheet" href="/vendor/adminlte/css/adminlte.rtl.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <style>
      body {
        font-family: Vazirmatn, Tahoma, sans-serif;
        background: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-box {
        width: 380px;
        max-width: 92vw;
      }
      .login-card {
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.10);
      }
      .login-logo {
        text-align: center;
        color: #1e293b;
        font-weight: 800;
        font-size: 22px;
        margin-bottom: 20px;
      }
      .login-logo span {
        color: #3b82f6;
      }
      .btn-primary {
        background: #3b82f6;
        border: none;
      }
      .btn-primary:hover {
        background: #2563eb;
      }
      #loginError {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="login-logo">پیکسل<span>لایف</span> — پنل ادمین</div>
      <div class="card login-card">
        <div class="card-body p-4">
          <p class="text-center text-muted mb-4">
            برای ورود، رمز عبور ادمین را وارد کنید
          </p>
          <div class="alert alert-danger py-2" id="loginError"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">رمز عبور</label>
              <input
                type="password"
                class="form-control"
                id="passwordInput"
                required
                autofocus
              />
            </div>
            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
              <i class="ti ti-login"></i> ورود
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("loginBtn");
          const errBox = document.getElementById("loginError");
          errBox.style.display = "none";
          btn.disabled = true;
          btn.innerHTML = '<i class="ti ti-loader"></i> در حال بررسی...';

          try {
            const res = await fetch("/admin/login", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                password: document.getElementById("passwordInput").value,
              }),
            });
            const json = await res.json();
            if (!json.success) throw new Error(json.message || "خطا در ورود");
            window.location.href = "/admin/products";
          } catch (err) {
            errBox.textContent = err.message;
            errBox.style.display = "block";
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="ti ti-login"></i> ورود';
          }
        });
    </script>
  </body>
</html>
