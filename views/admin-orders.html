<html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>مدیریت سفارش‌ها | پیکسل‌لایف</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"/><link rel="stylesheet" href="/vendor/adminlte/css/adminlte.rtl.min.css"/><link rel="stylesheet" href="/css/admin-light.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/><style>
body{font-family:Vazirmatn,Tahoma,sans-serif;color-scheme:light;background:#f8fafc!important;color:#1e293b!important}.app-wrapper,.app-main,.app-content,.app-content-header{background:#f8fafc!important;color:#1e293b!important}.app-sidebar{background:#fff!important;border-left:1px solid #e2e8f0}.app-sidebar .nav-link,.app-sidebar .brand-link{color:#334155!important}.app-sidebar .nav-link:hover{background:#eff6ff;color:#2563eb!important}.app-sidebar .nav-link.active{background:#dbeafe;color:#1d4ed8!important}.brand-link{font-weight:800}.brand-link span{color:#3b82f6}.card{background:#fff!important;border-color:#e2e8f0!important}.table{--bs-table-bg:#fff;--bs-table-color:#1e293b;--bs-table-border-color:#e2e8f0}.table>:not(caption)>*>*{background:var(--bs-table-bg)!important;color:var(--bs-table-color)!important}.order-num{font:700 12px monospace;direction:ltr}.customer{font-weight:700}.small-muted{font-size:12px;color:#64748b}

</head><body class="layout-fixed sidebar-expand-lg"><div class="app-wrapper"><nav class="app-header navbar bg-white border-bottom"><div class="container-fluid"><button class="btn btn-sm btn-outline-danger me-auto" id="logoutBtn"><i class="ti ti-logout"></i> خروج</button></div></nav><aside class="app-sidebar bg-white shadow-sm"><div class="sidebar-brand"><a href="/admin/products" class="brand-link">پیکسل<span>لایف</span></a></div><div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/admin/products" class="nav-link"><i class="nav-icon ti ti-device-mobile"></i><p>محصولات</p></a></li><li class="nav-item"><a href="/admin/customers" class="nav-link"><i class="nav-icon ti ti-users"></i><p>مشتریان</p></a></li><li class="nav-item"><a href="/admin/orders" class="nav-link active"><i class="nav-icon ti ti-package"></i><p>سفارش‌ها</p></a></li><li class="nav-item"><a href="/admin/reviews" class="nav-link"><i class="nav-icon ti ti-message-star"></i><p>مدیریت نظرات</p></a></li><li class="nav-item"><a href="/admin/ai-products" class="nav-link"><i class="nav-icon ti ti-sparkles"></i><p>دستیار هوشمند محصولات</p></a></li><li class="nav-item"><a href="/admin/analytics" class="nav-link"><i class="nav-icon ti ti-chart-bar"></i><p>آمار بازدید</p></a></li><li class="nav-item"><a href="/" class="nav-link" target="_blank"><i class="nav-icon ti ti-external-link"></i><p>مشاهده‌ی سایت</p></a></li></ul></nav></div></aside><main class="app-main"><div class="app-content-header"><div class="container-fluid"><h3 class="mb-1">مدیریت سفارش‌ها</h3><p class="text-muted mb-0">پیگیری سفارش‌های ثبت‌شده و روند ارسال</p></div></div><div class="app-content"><div class="container-fluid"><div class="card"><div class="card-body"><div class="row g-2 mb-3"><div class="col-md-5"><input id="search" class="form-control" placeholder="شماره سفارش"/></div><div class="col-md-4"><select id="filter" class="form-select"><option value="">همه وضعیت‌ها</option><option value="awaiting_payment">در انتظار پرداخت</option><option value="processing">در حال پردازش</option><option value="shipped">ارسال‌شده</option><option value="delivered">تحویل‌شده</option><option value="cancelled">لغوشده</option><option value="returned">مرجوع‌شده</option></select></div><div class="col-md-3"><button id="searchBtn" class="btn btn-primary w-100"><i class="ti ti-search"></i> جست‌وجو</button></div></div><p id="summary" class="small-muted">در حال بارگذاری...</p><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>شماره سفارش</th><th>مشتری</th><th>کالاها</th><th>مبلغ</th><th>پرداخت</th><th>وضعیت</th><th>روند ارسال</th><th>تاریخ</th></tr></thead><tbody id="body"><tr><td colspan="7" class="text-center py-4 text-muted">در حال بارگذاری...</td></tr></tbody></table></div><div id="pages" class="d-flex justify-content-center gap-2"></div></div></div></div></div></main></div><script>
let page=1;const limit=20;const statusText={awaiting_payment:'در انتظار پرداخت',processing:'در حال پردازش',shipped:'ارسال‌شده',delivered:'تحویل‌شده',cancelled:'لغوشده',returned:'مرجوع‌شده'};const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';const date=v=>new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));async function load(p=page){page=p;const q=new URLSearchParams({page,limit,search:document.getElementById('search').value.trim(),status:document.getElementById('filter').value});const r=await fetch('/admin/api/orders?'+q),j=await r.json();if(!j.success){document.getElementById('body').innerHTML='<tr><td colspan="8" class="text-danger text-center py-4">خطا در دریافت سفارش‌ها</td></tr>';return}window.__orders=j.orders;document.getElementById('summary').textContent=Number(j.pagination.total).toLocaleString('fa-IR')+' سفارش';document.getElementById('body').innerHTML=j.orders.length?j.orders.map(o=>`<tr><td class="order-num">${e(o.orderNumber)}</td><td><div class="customer">${e([o.user?.firstName,o.user?.lastName].filter(Boolean).join(' ')||'—')}</div><div class="small-muted">${e(o.user?.mobile||'')}</div></td><td>${Number(o.items?.length||0).toLocaleString('fa-IR')} کالا</td><td>${money(o.total)}</td><td><span class="badge ${o.paymentStatus==='paid'?'text-bg-success':'text-bg-warning'}">${o.paymentStatus==='paid'?'پرداخت‌شده':'پرداخت‌نشده'}</span></td><td><select class="form-select form-select-sm" data-id="${o._id}" data-status><option value="awaiting_payment" ${o.status==='awaiting_payment'?'selected':''}>در انتظار پرداخت</option><option value="processing" ${o.status==='processing'?'selected':''}>در حال پردازش</option><option value="shipped" ${o.status==='shipped'?'selected':''}>ارسال‌شده</option><option value="delivered" ${o.status==='delivered'?'selected':''}>تحویل‌شده</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>لغوشده</option><option value="returned" ${o.status==='returned'?'selected':''}>مرجوع‌شده</option></select></td><td><button type="button" class="btn btn-sm ${o.paymentStatus==='paid'&&o.status!=='cancelled'?'btn-outline-success':'btn-outline-secondary'}" data-track="${o._id}" ${o.paymentStatus==='paid'&&o.status!=='cancelled'?'':'disabled title="فقط برای سفارش پرداخت‌شده"'}>${Number(o.tracking?.completed||0).toLocaleString('fa-IR')} از ${Number(o.tracking?.total||5).toLocaleString('fa-IR')} · ${e(o.tracking?.currentLabel||'')}</button></td><td class="small-muted">${date(o.createdAt)}</td></tr>`).join(''):'<tr><td colspan="8" class="text-center text-muted py-4">هنوز سفارشی ثبت نشده است.</td></tr>';document.getElementById('pages').innerHTML=j.pagination.totalPages>1?`<button class="btn btn-sm btn-outline-secondary" ${page<=1?'disabled':''} onclick="load(${page-1})">قبلی</button><span class="align-self-center small">${page.toLocaleString('fa-IR')} از ${j.pagination.totalPages.toLocaleString('fa-IR')}</span><button class="btn btn-sm btn-outline-secondary" ${page>=j.pagination.totalPages?'disabled':''} onclick="load(${page+1})">بعدی</button>`:''}document.getElementById('searchBtn').onclick=()=>load(1);document.getElementById('body').onchange=async ev=>{const s=ev.target.closest('[data-status]');if(!s)return;const r=await fetch('/admin/api/orders/'+s.dataset.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})}),j=await r.json();if(!j.success)alert(j.message||'خطا');load()};const TRACK=[['confirmed','تأیید و پردازش سفارش'],['packed','آماده‌سازی و بسته‌بندی'],['shipped','تحویل به پست / پیک'],['delivered','تحویل به مشتری']];
document.body.insertAdjacentHTML('beforeend','<style>#trackDlg{border:0;border-radius:16px;padding:0;width:min(440px,94vw);box-shadow:0 20px 60px rgba(15,23,42,.3)}#trackDlg::backdrop{background:rgba(15,23,42,.45)}#trackDlg form{padding:20px}.trk-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;cursor:pointer}.trk-row input{width:20px;height:20px;accent-color:#16a34a}.trk-row.on{background:#f0fdf4;border-color:#86efac}.trk-bar{height:8px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin:6px 0 14px}.trk-bar span{display:block;height:100%;background:#22c55e;transition:width .4s}</style><dialog id="trackDlg"><form method="dialog" novalidate><h5 class="mb-1">روند ارسال سفارش</h5><div class="small-muted mb-2" id="trkOrder"></div><div class="trk-bar"><span id="trkFill"></span></div><div id="trkRows"></div><div id="trkErr" class="text-danger small mb-2" role="alert"></div><div class="d-flex gap-2 justify-content-end"><button type="button" class="btn btn-outline-secondary" id="trkCancel">انصراف</button><button type="submit" class="btn btn-success" id="trkSave">ذخیره</button></div></form></dialog>');
let trkId=null;const trkRows=document.getElementById('trkRows');
function trkRender(on){trkRows.innerHTML=TRACK.map(([k,l],i)=>`<label class="trk-row ${i<on?'on':''}"><input type="checkbox" data-i="${i}" ${i<on?'checked':''}><span>${e(l)}</span></label>`).join('');document.getElementById('trkFill').style.width=Math.round((on+1)/(TRACK.length+1)*100)+'%'}
trkRows.addEventListener('change',ev=>{const i=Number(ev.target.dataset.i);trkRender(ev.target.checked?i+1:i)});
document.getElementById('body').addEventListener('click',ev=>{const b=ev.target.closest('[data-track]');if(!b)return;const o=(window.__orders||[]).find(x=>x._id===b.dataset.track);if(!o)return;trkId=o._id;document.getElementById('trkErr').textContent='';document.getElementById('trkOrder').textContent='سفارش '+o.orderNumber;const done=new Set((o.trackingSteps||[]).map(s=>s.key));let on=0;while(on<TRACK.length&&done.has(TRACK[on][0]))on++;trkRender(on);document.getElementById('trackDlg').showModal()});
document.getElementById('trkCancel').onclick=()=>document.getElementById('trackDlg').close();
document.querySelector('#trackDlg form').addEventListener('submit',async ev=>{ev.preventDefault();const steps=[...trkRows.querySelectorAll('input:checked')].map(x=>TRACK[Number(x.dataset.i)][0]);const btn=document.getElementById('trkSave');btn.disabled=true;const r=await fetch('/admin/api/orders/'+encodeURIComponent(trkId)+'/tracking',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps})}),j=await r.json().catch(()=>({success:false,message:'پاسخ نامعتبر'}));btn.disabled=false;if(!j.success){document.getElementById('trkErr').textContent=j.message||'ذخیره نشد';return}document.getElementById('trackDlg').close();load()});
document.getElementById('logoutBtn').onclick=async()=>{await fetch('/admin/logout',{method:'POST'});location='/admin/login'};load();
</script><script src="/js/admin-sidebar.js?v=12" defer></script></body></html>
