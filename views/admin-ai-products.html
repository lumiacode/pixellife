<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دستیار محصولات | PixelLife</title><style>body{font-family:tahoma;background:#f5f7fb;margin:0;color:#172033}.box{max-width:900px;margin:36px auto;background:#fff;padding:24px;border-radius:16px}select,textarea,button{font:inherit;width:100%;padding:12px;margin:8px 0;box-sizing:border-box}textarea{min-height:110px}.grid{display:grid;gap:12px}.card{border:1px solid #dbe3ee;border-radius:10px;padding:14px;white-space:pre-wrap}.primary{background:#2563eb;color:#fff;border:0;border-radius:9px}.apply{background:#16a34a;color:#fff;border:0;border-radius:9px}</style><link rel="stylesheet" href="/css/admin-light.css">
  <style id="admin-sidebar-critical">
    .app-sidebar:not(.admin-unified-sidebar){visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  </style>
</head><body><main class="box"><a href="/admin/products">← محصولات</a><h1>دستیار هوشمند محصولات</h1><p>پیشنهاد می‌سازد؛ هیچ تغییری بدون دکمهٔ «اعمال» ذخیره نمی‌شود.</p><select id="product"><option>در حال دریافت محصولات...</option></select><textarea id="request" placeholder="مثال: برای این محصول مشخصات فنی، توضیح سئویی و متن پست اینستاگرام بساز"></textarea><button class="primary" id="ask">ساخت پیشنهاد</button><div id="result" class="grid"></div></main><script>let suggested={};const q=s=>document.querySelector(s);async function products(){const r=await fetch("/admin/api/products");const j=await r.json();q("#product").innerHTML=j.products.map(p=>`<option value="${p._id}">${p.name}</option>`).join("")}q("#ask").onclick=async()=>{q("#result").innerHTML="در حال ساخت...";const r=await fetch("/admin/api/ai/products/suggest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:q("#product").value,request:q("#request").value})});const j=await r.json();if(!j.success){q("#result").textContent=j.message;return}suggested=j.suggestions;q("#result").innerHTML=Object.entries(suggested).map(([k,v])=>`<div class="card"><strong>${k}</strong><br>${String(v).replace(/</g,"&lt;")}</div>`).join("")+`<button class="apply" id="apply">تأیید و اعمال همهٔ پیشنهادها</button>`;q("#apply").onclick=apply};async function apply(){const r=await fetch("/admin/api/ai/products/"+q("#product").value+"/apply",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({changes:suggested})});const j=await r.json();alert(j.success?"تغییرات ذخیره شد":j.message)}products()</script><script src="/js/admin-sidebar.js?v=12" defer></script></body></html>
